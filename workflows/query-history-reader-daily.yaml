query-history-reader-daily:
  dag_id: query-history-reader-daily
  default_args:
    retries: 1
    retry_delay:
      __type__: datetime.timedelta
      seconds: 500
    start_date: "2026-09-09T00:00:00.000Z"
  schedule: "@daily"
  is_paused_upon_creation: true
  tasks:
    run_query_history_reader:
      operator: airflow.providers.amazon.aws.operators.glue.GlueJobOperator
      job_name: query-history-reader
      wait_for_completion: true
      create_job_kwargs:
        Command:
          Name: glueetl
          PythonVersion: "3"
        GlueVersion: "5.0"
