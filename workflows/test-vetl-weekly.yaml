test-vetl-weekly:
  dag_id: test-vetl-weekly
  schedule: "0 16 * * 1"
  default_args:
    start_date: "2026-09-01T00:00:00.000Z"
    retries: 1
    retry_delay:
      __type__: datetime.timedelta
      seconds: 300
  tasks:
    run_test_vetl:
      operator: airflow.providers.amazon.aws.operators.glue.GlueJobOperator
      job_name: test-vetl
      wait_for_completion: true
